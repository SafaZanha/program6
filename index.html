<!doctype html>
<html>
    <head>
        <title>
            student attendence tracker
        </title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <h1>student attendence tracker</h1>
        <div class="content">
            <input id="name" placeholder="enter student name">
            <select id="status">
                <option value="present">present</option>
                <option value="absent">absent</option>
            </select>
            <button onclick="markattendence()">mark attendence</button>
            <h2>attendence</h2>
            <div id="list"></div>
            <p id="count"></p>
        </div>
        <script src="script.js"></script>
    </body>
</html>
